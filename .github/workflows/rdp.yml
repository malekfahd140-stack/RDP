name: RDP

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP and Create User
        run: |
          # إنشاء المستخدم وصلاحيات الأدمن
          net user kamel123 MyStrong123 /add
          net localgroup administrators kamel123 /add
          
          # تفعيل الـ RDP في الويندوز والفايروال
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Setup tmate Session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false

      - name: Keep Alive
        run: |
          # سكريبت لمنع السيرفر من الإغلاق التلقائي ومواصلة تشغيل الـ RDP
          while ($true) { Start-Sleep -Seconds 60 }
