name: RDP

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download and Setup ngrok
        run: |
          # 1. Download the zip
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip -OutFile ngrok.zip
          
          # 2. Extract the archive
          Expand-Archive ngrok.zip -DestinationPath . -Force
          
          # 3. Verify ngrok.exe exists and get its location
          Get-ChildItem -Name ngrok.exe -Recurse
          
          # 4. Authenticate using the full path
          & ".\ngrok.exe" authtoken 2jRDuZgdIfGuJbsFEqfbFGvrTEw_4FvfX7k3EdeWj8bHBkqh6

      - name: Enable RDP and Start Tunnel
        run: |
          net user kamel123 MyStrong123 /add
          net localgroup administrators kamel123 /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Use the same reference as authentication step
          & ".\ngrok.exe" tcp 3389
